[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "angerona"
version = "1.10.0"
description = "Local-first endpoint security suite for Windows, macOS, and Linux."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Angerona contributors" }]
keywords = [
    "endpoint-security",
    "edr",
    "ndr",
    "soar",
    "dfir",
    "threat-hunting",
    "incident-response",
    "mitre-attack",
    "purple-team",
    "local-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "PySide6>=6.6",
    "psutil>=5.9",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "cryptography>=50.0.0",
    "PyYAML>=6.0.2",
    "defusedxml>=0.7.1",
]

[project.urls]
Homepage = "https://github.com/Ag3nt47/AngeronaSuite"
Repository = "https://github.com/Ag3nt47/AngeronaSuite.git"
Documentation = "https://github.com/Ag3nt47/AngeronaSuite#readme"
Issues = "https://github.com/Ag3nt47/AngeronaSuite/issues"
Releases = "https://github.com/Ag3nt47/AngeronaSuite/releases"

[project.optional-dependencies]
windows = [
    "pywin32>=306",
    "WMI>=1.5",
    "scapy>=2.5",
    "yara-x>=1.15",
    "PyJWT[crypto]>=2.8",
    "pywintrace>=0.2",
]
macos = [
    "yara-x>=1.15",
]
linux = [
    "yara-x>=1.15",
]
voice = [
    "sounddevice>=0.5",
    "pyttsx3>=2.90",
    "tqdm>=4.68",
    "websockets>=16",
]
hand-controls = [
    "opencv-python>=4.10",
    "mediapipe>=0.10.20",
]
cloud = ["google-genai", "groq", "openai"]
dev = [
    "hypothesis==6.163.0",
    "ruff==0.16.0",
    "pytest-xdist==3.8.0",
    "pip-audit==2.10.1",
]

[project.gui-scripts]
angerona = "angerona.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["angerona*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["frz", "hermetic", "runtime-data", "LibreOffice_*"]

[tool.ruff.lint]
# Start with correctness-critical rules. Broader style adoption is intentionally
# staged so a fast safety check does not force a noisy whole-repository rewrite.
select = ["E9", "F63", "F7", "F82"]
