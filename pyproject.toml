[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angerona"
version = "1.9.4"
description = "Local-first endpoint security suite: Windows protection with a macOS Observe preview."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Angerona contributors" }]
dependencies = [
    "PySide6>=6.6",
    "psutil>=5.9",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "cryptography>=42.0",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
    "WMI>=1.5",
    "scapy>=2.5",
    "yara-x>=1.15",
    "PyJWT[crypto]>=2.8",
    "pywintrace>=0.2",
]
macos = [
    "yara-x>=1.15",
]
voice = [
    "sounddevice>=0.5",
    "pyttsx3>=2.90",
    "tqdm>=4.68",
    "websockets>=16",
]
cloud = ["google-genai", "groq", "openai"]
dev = [
    "hypothesis==6.163.0",
    "ruff==0.16.0",
    "pytest-xdist==3.8.0",
    "pip-audit==2.10.1",
]

[project.gui-scripts]
angerona = "angerona.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["angerona*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["frz", "hermetic", "runtime-data", "LibreOffice_*"]

[tool.ruff.lint]
# Start with correctness-critical rules. Broader style adoption is intentionally
# staged so a fast safety check does not force a noisy whole-repository rewrite.
select = ["E9", "F63", "F7", "F82"]
