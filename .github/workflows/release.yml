name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-source:
    name: Verify public release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag-object: ${{ steps.source.outputs.tag-object }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require immutable source visible from public main
        id: source
        shell: bash
        env:
          ANGERONA_EVENT: ${{ github.event_name }}
          ANGERONA_REF: ${{ github.ref }}
          ANGERONA_REF_NAME: ${{ github.ref_name }}
          ANGERONA_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          default_refs="$(git ls-remote --symref origin HEAD refs/heads/main)"
          [[ "$(printf '%s\n' "$default_refs" | \
            grep -c $'^ref: refs/heads/main\tHEAD$')" -eq 1 ]]
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          if [[ "$ANGERONA_EVENT" == "push" ]]; then
            [[ "$ANGERONA_REF" == refs/tags/v* ]]
            tag_ref="refs/tags/$ANGERONA_REF_NAME"
            tag_lines="$(git ls-remote --refs origin "$tag_ref")"
            [[ "$(printf '%s\n' "$tag_lines" | \
              awk -v ref="$tag_ref" '$2 == ref { count++ } END { print count+0 }')" \
              -eq 1 ]]
            tag_object="$(printf '%s\n' "$tag_lines" | \
              awk -v ref="$tag_ref" '$2 == ref { print $1 }')"
            [[ "$tag_object" =~ ^[0-9a-f]{40,64}$ ]]
            echo "tag-object=$tag_object" >> "$GITHUB_OUTPUT"
            git fetch --no-tags origin \
              "refs/tags/$ANGERONA_REF_NAME:refs/tags/$ANGERONA_REF_NAME"
            [[ "$(git rev-parse "$ANGERONA_REF_NAME^{commit}")" == \
               "$ANGERONA_SOURCE_SHA" ]]
            git merge-base --is-ancestor \
              "$ANGERONA_SOURCE_SHA" refs/remotes/origin/main
            version="$(python - <<'PY'
          import pathlib
          import re

          pyproject = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          package = pathlib.Path('src/angerona/__init__.py').read_text(
              encoding='utf-8'
          )
          project_match = re.search(r'^version = "([0-9]+\.[0-9]+\.[0-9]+)"$', pyproject, re.M)
          package_match = re.search(r'^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$', package, re.M)
          if project_match is None or package_match is None:
              raise SystemExit('version declaration is missing')
          if project_match.group(1) != package_match.group(1):
              raise SystemExit('package and project versions disagree')
          print(project_match.group(1))
          PY
          )"
            [[ "$ANGERONA_REF_NAME" == "v$version" ]]
          else
            [[ "$ANGERONA_EVENT" == "workflow_dispatch" ]]
            [[ "$ANGERONA_REF" == "refs/heads/main" ]]
            [[ "$ANGERONA_SOURCE_SHA" == \
               "$(git rev-parse refs/remotes/origin/main)" ]]
            echo "tag-object=$ANGERONA_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          fi

  prepare-windows:
    needs: verify-release-source
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      artifact-tag: ${{ steps.artifact_name.outputs.tag }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve filesystem-safe artifact label
        id: artifact_name
        shell: pwsh
        env:
          ANGERONA_RELEASE_EVENT: ${{ github.event_name }}
          ANGERONA_RELEASE_REF: ${{ github.ref_name }}
        run: |
          $artifactTag = python tools/release_artifact_tag.py
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($artifactTag)) {
            throw 'Could not derive a safe release artifact label.'
          }
          "tag=$artifactTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install audited dependencies
        shell: pwsh
        run: |
          # Every third-party wheel is both version-pinned and SHA-256-gated.
          # --no-deps is safe because the reviewed lock enumerates the complete
          # transitive Windows/Python 3.12 environment.
          python -m pip install --require-hashes --no-deps `
            -r requirements-bootstrap-pip.txt
          python -m pip install --require-hashes --no-deps `
            -r requirements-release-hashed.txt
          python -m pip install --no-build-isolation --no-deps .
          # Vosk's wheel is audited, but its upstream srt dependency is source-only.
          # Angerona ships the two-function compatibility surface Vosk actually uses.
          python tools/build_srt_compat_wheel.py --out build/vendor-wheels
          python -m pip install --only-binary :all: build/vendor-wheels/srt-0.0.0+angerona.1-py3-none-any.whl

      - name: Run release gates
        shell: pwsh
        run: |
          python -m compileall -q src tests
          python -m pytest -q

      - name: Bundle verified offline conversation model
        shell: pwsh
        run: |
          $bundleData = Join-Path (Resolve-Path ".") "build/bundled-runtime"
          New-Item -ItemType Directory -Force -Path $bundleData | Out-Null
          $env:ANGERONA_DATA = $bundleData
          python -c "from angerona.connectors.voice import install_offline_model; print(install_offline_model())"

      - name: Build one-file executables with embedded sidecar integrity
        shell: pwsh
        env:
          # Optional exact Authenticode subject provisioned by the protected
          # release environment. An empty value keeps FRZ fail-closed at runtime.
          ANGERONA_FRZ_PUBLISHER: ${{ vars.ANGERONA_FRZ_PUBLISHER }}
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name AngeronaBlackBox `
            --icon "assets/icons/blackbox.ico" `
            --distpath "dist/Angerona" `
            --workpath "build/AngeronaBlackBox" `
            --specpath "build" `
            --collect-all PySide6 `
            --collect-all psutil `
            --add-data "assets;assets" `
            blackbox_recorder.py

          $blackBox = Resolve-Path "dist/Angerona/AngeronaBlackBox.exe"
          $blackBoxHash = (Get-FileHash -Algorithm SHA256 $blackBox).Hash.ToLowerInvariant()
          Push-Location frz
          try {
            go build -mod=readonly -trimpath -buildvcs=false -ldflags="-s -w" `
              -o ../dist/Angerona/frz_watchdog_v2.exe frz_watchdog.go
            if ($LASTEXITCODE -ne 0) { throw 'FRZ watchdog build failed.' }
          } finally {
            Pop-Location
          }
          $frzWatchdog = Resolve-Path "dist/Angerona/frz_watchdog_v2.exe"
          $frzWatchdogHash = (Get-FileHash -Algorithm SHA256 $frzWatchdog).Hash.ToLowerInvariant()
          $frzPublisherLiteral = python -c "import json,os; print(json.dumps(os.environ.get('ANGERONA_FRZ_PUBLISHER','')))"
          if ($LASTEXITCODE -ne 0) { throw 'FRZ publisher pin encoding failed.' }
          @(
            '"""Generated by the release workflow; do not edit in an artifact."""'
            ''
            "BLACKBOX_SHA256 = `"$blackBoxHash`""
            "FRZ_WATCHDOG_SHA256 = `"$frzWatchdogHash`""
            "FRZ_WATCHDOG_PUBLISHER = $frzPublisherLiteral"
          ) | Set-Content -Encoding utf8 "src/angerona/_release_integrity.py"

          pyinstaller --noconfirm --clean --windowed --onefile `
            --name Angerona `
            --icon "assets/icons/angerona.ico" `
            --distpath "dist/Angerona" `
            --workpath "build/AngeronaMain" `
            --specpath "build" `
            --paths src `
            --collect-all PySide6 `
            --collect-all yara_x `
            --collect-all vosk `
            --collect-all sounddevice `
            --collect-submodules angerona.modules `
            --collect-submodules angerona.resilience `
            --add-data "modules;modules" `
            --add-data "assets;assets" `
            --add-data "rules.yar;." `
            --add-data "build/bundled-runtime/models;runtime-data/models" `
            --hidden-import angerona `
            src/angerona/__main__.py

          pyinstaller --noconfirm --clean --console --onefile `
            --name AngeronaReleaseVerifier `
            --distpath "dist/Angerona" `
            --workpath "build/AngeronaReleaseVerifier" `
            --specpath "build" `
            --paths src `
            --hidden-import angerona.core.update_authority `
            tools/verify_release_upgrade.py

      - name: Verify frozen application contents
        shell: pwsh
        run: |
          $listing = (& pyi-archive_viewer --recursive "dist/Angerona/Angerona.exe" | Out-String)
          if ($listing -notmatch 'angerona\.modules\.purple_guard') {
            throw 'Frozen archive is missing dynamically discovered Angerona modules.'
          }
          if ($listing -notmatch 'angerona\._release_integrity') {
            throw 'Frozen archive is missing its embedded Black Box digest.'
          }
          if (-not (Test-Path "dist/Angerona/AngeronaBlackBox.exe")) {
            throw 'Frozen Black Box sidecar was not created.'
          }
          if (-not (Test-Path "dist/Angerona/frz_watchdog_v2.exe")) {
            throw 'Frozen FRZ watchdog sidecar was not created.'
          }

      - name: Bundle release installer and documentation
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, Install-Angerona-Release.bat, Install-Angerona-Release.ps1, Verify-Angerona-Release.ps1 -Destination dist/Angerona/
          if (Test-Path SECURITY.md) { Copy-Item SECURITY.md -Destination dist/Angerona/ }
          if (Test-Path docs) { Copy-Item docs -Destination dist/Angerona/docs -Recurse }
          if (Test-Path playbooks) { Copy-Item playbooks -Destination dist/Angerona/playbooks -Recurse }

      - name: Prepare unsigned payload and canonical signing request
        shell: pwsh
        env:
          ANGERONA_ARTIFACT_TAG: ${{ steps.artifact_name.outputs.tag }}
          ANGERONA_SOURCE_REVISION: ${{ github.sha }}
          ANGERONA_INVOCATION_ID: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          cyclonedx-py environment --output-format JSON --output-file Angerona-SBOM.json
          Copy-Item -LiteralPath Angerona-SBOM.json -Destination dist/Angerona/Angerona-SBOM.json
          $appVersion = $env:ANGERONA_ARTIFACT_TAG -replace '^v', ''
          if ($appVersion -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            $appVersion = python -c "from angerona import __version__; print(__version__)"
          }
          $env:PYTHONPATH = 'src'
          python tools/build_release_authorization.py manifest `
            --payload-root dist/Angerona `
            --output dist/Angerona/release-payload-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Canonical payload manifest creation failed.' }
          $catalog = Join-Path $env:RUNNER_TEMP 'release-payload-unsigned.cat'
          New-FileCatalog -Path dist/Angerona -CatalogFilePath $catalog `
            -CatalogVersion 2.0 | Out-Null
          Copy-Item -LiteralPath $catalog -Destination dist/Angerona/release-payload.cat
          python tools/build_release_authorization.py prepare `
            --artifact dist/Angerona/Angerona.exe `
            --sbom dist/Angerona/Angerona-SBOM.json `
            --payload-manifest dist/Angerona/release-payload-manifest.json `
            --payload-catalog dist/Angerona/release-payload.cat `
            --provenance-output dist/Angerona/release-build-provenance.json `
            --statement-output dist/Angerona/release-statement.json `
            --version $appVersion --platform windows-x64 `
            --source-revision $env:ANGERONA_SOURCE_REVISION `
            --invocation-id $env:ANGERONA_INVOCATION_ID
          if ($LASTEXITCODE -ne 0) { throw 'Signing request preparation failed.' }
      - name: Upload immutable prepared Windows payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-windows-payload
          if-no-files-found: error
          path: dist/Angerona
          retention-days: 3
      - name: Upload canonical statement for an external release authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-release-signing-request
          if-no-files-found: error
          path: dist/Angerona/release-statement.json
          retention-days: 3

  finalize-release-authority:
    name: Require provisioned external release authority
    needs: package-windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Stop before any release or publisher key enters this workflow
        shell: /usr/bin/env -i PATH=/usr/bin:/bin /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          echo "Release publication is disabled: the independently maintained" >&2
          echo "OIDC-backed, non-exportable release and Windows publisher" >&2
          echo "authority is not provisioned. Prepared payload, package, and" >&2
          echo "digest artifacts are untrusted requests, never authorization." >&2
          echo "No finalized-windows-release-assets artifact is produced." >&2
          echo "See docs/enterprise/RELEASE_SIGNING_BOUNDARY.md." >&2
          exit 1

  package-windows:
    needs: prepare-windows
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - shell: pwsh
        run: python -m pip install --require-hashes --no-deps -r requirements-release-hashed.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prepared-windows-payload
          path: dist/Angerona
      - name: Build and structurally verify unsigned MSIX request
        shell: pwsh
        env:
          ANGERONA_ARTIFACT_TAG: ${{ needs.prepare-windows.outputs.artifact-tag }}
          ANGERONA_MSIX_PACKAGE_NAME: ${{ vars.ANGERONA_MSIX_PACKAGE_NAME }}
          ANGERONA_MSIX_PUBLISHER_DN: ${{ vars.ANGERONA_MSIX_PUBLISHER_DN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANGERONA_MSIX_PACKAGE_NAME) -or
              [string]::IsNullOrWhiteSpace($env:ANGERONA_MSIX_PUBLISHER_DN)) {
            throw 'Exact protected MSIX package Name and Publisher DN are required.'
          }
          python tools/build_msix_package.py validate-contract `
            --contract installer/windows-install-contract.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows installation contract failed.' }
          $tag = $env:ANGERONA_ARTIFACT_TAG
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          }
          $stage = Join-Path $env:RUNNER_TEMP 'angerona-msix-stage'
          $unpacked = Join-Path $env:RUNNER_TEMP 'angerona-msix-unpacked'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path 'dist/Angerona/*' -Destination $stage -Recurse
          python tools/build_msix_package.py render-manifest `
            --template installer/msix/AppxManifest.xml.in `
            --output (Join-Path $stage 'AppxManifest.xml') `
            --package-name $env:ANGERONA_MSIX_PACKAGE_NAME `
            --publisher-dn $env:ANGERONA_MSIX_PUBLISHER_DN `
            --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Strict AppxManifest rendering failed.' }
          python tools/build_msix_package.py build-assets `
            --source assets/icons/angerona_icon_512.png `
            --output (Join-Path $stage 'Assets')
          if ($LASTEXITCODE -ne 0) { throw 'Deterministic MSIX asset rendering failed.' }

          $sdkVersion = '10.0.26100.0'
          $sdkBin = Join-Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            "$sdkVersion\x64"
          $makeAppx = Join-Path $sdkBin 'makeappx.exe'
          if (-not (Test-Path -LiteralPath $makeAppx -PathType Leaf)) {
            throw "Pinned Windows SDK tool is unavailable: $makeAppx"
          }

          $msix = "Angerona-$tag-win64-unsigned.msix"
          & $makeAppx pack /d $stage /p $msix /o
          if ($LASTEXITCODE -ne 0) { throw 'Pinned MakeAppx package build failed.' }
          New-Item -ItemType Directory -Force -Path $unpacked | Out-Null
          & $makeAppx unpack /p $msix /d $unpacked /o
          if ($LASTEXITCODE -ne 0) { throw 'MSIX structural unpack verification failed.' }
          $sourceFiles = @(Get-ChildItem -LiteralPath $stage -Recurse -File)
          $sourceNames = @{}
          foreach ($source in $sourceFiles) {
            $relative = [IO.Path]::GetRelativePath($stage, $source.FullName)
            $sourceNames[$relative.ToLowerInvariant()] = $true
            $destination = Join-Path $unpacked $relative
            if (-not (Test-Path -LiteralPath $destination -PathType Leaf) -or
                (Get-FileHash -LiteralPath $source.FullName -Algorithm SHA256).Hash -ine
                  (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash) {
              throw "MSIX payload reconstruction mismatch: $relative"
            }
          }
          $generated = @('appxblockmap.xml', '[content_types].xml')
          foreach ($file in Get-ChildItem -LiteralPath $unpacked -Recurse -File) {
            $relative = [IO.Path]::GetRelativePath($unpacked, $file.FullName)
            if (-not $sourceNames.ContainsKey($relative.ToLowerInvariant()) -and
                $relative.ToLowerInvariant() -notin $generated) {
              throw "Unexpected file in reconstructed MSIX: $relative"
            }
          }
          (Get-FileHash -Algorithm SHA256 $msix).Hash.ToLowerInvariant() +
            "  " + $msix | Set-Content -Encoding ascii "$msix.sha256"

      - name: Prepare bounded unsigned Windows publisher request
        shell: pwsh
        env:
          ANGERONA_ARTIFACT_TAG: ${{ needs.prepare-windows.outputs.artifact-tag }}
        run: |
          $tag = $env:ANGERONA_ARTIFACT_TAG
          $zip = "Angerona-$tag-win64-unsigned.zip"
          Compress-Archive -Path dist/Angerona/* -DestinationPath $zip
          (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant() +
            "  " + $zip | Set-Content -Encoding ascii "$zip.sha256"
          $msix = "Angerona-$tag-win64-unsigned.msix"
          @(
            (Get-Content -LiteralPath "$msix.sha256" -Raw).Trim()
            (Get-Content -LiteralPath "$zip.sha256" -Raw).Trim()
          ) | Set-Content -Encoding ascii windows-publisher-request.sha256
          Copy-Item -LiteralPath dist/Angerona/Angerona-SBOM.json -Destination Angerona-SBOM.json
          Copy-Item -LiteralPath dist/Angerona/Verify-Angerona-Release.ps1 -Destination Verify-Angerona-Release.ps1
      - name: Upload unsigned Windows publisher request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-windows-publisher-request
          if-no-files-found: error
          retention-days: 3
          path: |
            Angerona-${{ needs.prepare-windows.outputs.artifact-tag }}-win64-unsigned.msix
            Angerona-${{ needs.prepare-windows.outputs.artifact-tag }}-win64-unsigned.msix.sha256
            Angerona-${{ needs.prepare-windows.outputs.artifact-tag }}-win64-unsigned.zip
            Angerona-${{ needs.prepare-windows.outputs.artifact-tag }}-win64-unsigned.zip.sha256
            windows-publisher-request.sha256
            Angerona-SBOM.json
            Verify-Angerona-Release.ps1

  build-posix:
    needs: verify-release-source
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            artifact: linux-x86_64
            extension: tar.gz
          - os: macos-15
            platform: macos
            artifact: macos-arm64
            extension: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve filesystem-safe artifact label
        id: artifact_name
        shell: bash
        env:
          ANGERONA_RELEASE_EVENT: ${{ github.event_name }}
          ANGERONA_RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          artifact_tag="$(python tools/release_artifact_tag.py)"
          test -n "$artifact_tag"
          printf 'tag=%s\n' "$artifact_tag" >> "$GITHUB_OUTPUT"

      - name: Download and verify locked platform wheels
        shell: bash
        run: |
          set -euo pipefail
          lock="release/locks/posix/${{ matrix.artifact }}.txt"
          manifest="release/locks/posix/${{ matrix.artifact }}.manifest.json"
          wheelhouse="$RUNNER_TEMP/angerona-wheelhouse-${{ matrix.artifact }}"
          mkdir -m 700 "$wheelhouse"
          PIP_DISABLE_PIP_VERSION_CHECK=1 python -m pip download \
            --dest "$wheelhouse" --only-binary=:all: \
            --require-hashes --no-deps -r "$lock"
          python tools/verify_wheelhouse.py \
            --target "${{ matrix.artifact }}" --wheelhouse "$wheelhouse" \
            --lock "$lock" --manifest "$manifest"

      - name: Install verified platform dependencies offline
        shell: bash
        run: |
          set -euo pipefail
          lock="release/locks/posix/${{ matrix.artifact }}.txt"
          wheelhouse="$RUNNER_TEMP/angerona-wheelhouse-${{ matrix.artifact }}"
          PIP_DISABLE_PIP_VERSION_CHECK=1 python -m pip install \
            --no-index --find-links "$wheelhouse" \
            --require-hashes --no-deps -r "$lock"
          PIP_DISABLE_PIP_VERSION_CHECK=1 python -m pip install \
            --no-index --find-links "$wheelhouse" \
            --no-build-isolation --no-deps .
          python -m pip check

      - name: Run platform release gates
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests tools
          python -m pytest -q
          python -m pip_audit
          python - <<'PY'
          from angerona.core.config import Config
          from angerona.core.eventbus import EventBus
          from angerona.core.module_manager import ModuleManager

          manager = ModuleManager(EventBus(), Config.load())
          manager.discover()
          if manager.discovery_errors:
              raise SystemExit(manager.discovery_errors)
          print(f"platform discovery: {len(manager.modules)} capabilities")
          PY

      - name: Build native application
        shell: bash
        run: |
          set -euo pipefail
          pyinstaller --noconfirm --clean --windowed --onefile \
            --name Angerona \
            --distpath dist \
            --workpath build/Angerona \
            --specpath build \
            --paths src \
            --collect-all PySide6 \
            --collect-all yara_x \
            --collect-all psutil \
            --collect-submodules angerona.modules \
            --collect-submodules angerona.resilience \
            --add-data "modules:modules" \
            --add-data "assets:assets" \
            --add-data "rules.yar:." \
            --hidden-import angerona \
            src/angerona/__main__.py

      - name: Verify and package native application
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ steps.artifact_name.outputs.tag }}
        run: |
          set -euo pipefail
          listing=$(pyi-archive_viewer --recursive \
            "$([ "$PLATFORM" = macos ] && printf 'dist/Angerona.app/Contents/MacOS/Angerona' || printf 'dist/Angerona')")
          printf '%s' "$listing" | grep -q 'angerona.modules.linux_observe\|angerona.modules.macos_observe'
          printf '%s' "$listing" | grep -q 'angerona.core.sensor_events'

          package="package-$ARTIFACT"
          mkdir -p "$package"
          cp README.md LICENSE Install-Angerona-Release.sh uninstall-angerona.sh "$package/"
          if [ "$PLATFORM" = macos ]; then
            cp -R dist/Angerona.app "$package/"
            archive="Angerona-$TAG-$ARTIFACT.zip"
            ditto -c -k --sequesterRsrc --keepParent "$package" "$archive"
          else
            install -m 0755 dist/Angerona "$package/Angerona"
            archive="Angerona-$TAG-$ARTIFACT.tar.gz"
            tar -czf "$archive" "$package"
          fi
          shasum -a 256 "$archive" > "$archive.sha256"
          cyclonedx-py environment --output-format JSON \
            --output-file "Angerona-SBOM-$ARTIFACT.json"
          python -m pip freeze --all > "Angerona-dependencies-$ARTIFACT.txt"

      - name: Upload platform release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: angerona-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            Angerona-${{ steps.artifact_name.outputs.tag }}-${{ matrix.artifact }}.${{ matrix.extension }}
            Angerona-${{ steps.artifact_name.outputs.tag }}-${{ matrix.artifact }}.${{ matrix.extension }}.sha256
            Angerona-SBOM-${{ matrix.artifact }}.json
            Angerona-dependencies-${{ matrix.artifact }}.txt

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-release-source, package-windows, finalize-release-authority, build-posix]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Re-check tag and public-main ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: source
      - name: Fail if release source moved or left public main
        shell: bash
        working-directory: source
        env:
          ANGERONA_REF_NAME: ${{ github.ref_name }}
          ANGERONA_SOURCE_SHA: ${{ github.sha }}
          ANGERONA_TAG_OBJECT: ${{ needs.verify-release-source.outputs.tag-object }}
        run: |
          set -euo pipefail
          default_refs="$(git ls-remote --symref origin HEAD refs/heads/main)"
          [[ "$(printf '%s\n' "$default_refs" | \
            grep -c $'^ref: refs/heads/main\tHEAD$')" -eq 1 ]]
          tag_ref="refs/tags/$ANGERONA_REF_NAME"
          [[ "$(git ls-remote --refs origin "$tag_ref" | \
            awk -v ref="$tag_ref" '$2 == ref { print $1 }')" == \
            "$ANGERONA_TAG_OBJECT" ]]
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin \
            "refs/tags/$ANGERONA_REF_NAME:refs/tags/$ANGERONA_REF_NAME"
          [[ "$(git rev-parse "$ANGERONA_REF_NAME^{commit}")" == \
             "$ANGERONA_SOURCE_SHA" ]]
          git merge-base --is-ancestor \
            "$ANGERONA_SOURCE_SHA" refs/remotes/origin/main
      - name: Download exact gated Windows assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: finalized-windows-release-assets
          path: .

      - name: Download exact gated Linux assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: angerona-linux-x86_64
          path: .

      - name: Download exact gated macOS assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: angerona-macos-arm64
          path: .

      - name: Attest release archive
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e # v4
        with:
          subject-path: |
            Angerona-${{ github.ref_name }}-win64.msix
            Angerona-${{ github.ref_name }}-win64.zip
            Angerona-${{ github.ref_name }}-linux-x86_64.tar.gz
            Angerona-${{ github.ref_name }}-macos-arm64.zip

      - name: Attest software bill of materials
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: |
            Angerona-${{ github.ref_name }}-win64.msix
            Angerona-${{ github.ref_name }}-win64.zip
          sbom-path: Angerona-SBOM.json

      - name: Final immutable tag and default-main check
        shell: bash
        working-directory: source
        env:
          ANGERONA_REF_NAME: ${{ github.ref_name }}
          ANGERONA_SOURCE_SHA: ${{ github.sha }}
          ANGERONA_TAG_OBJECT: ${{ needs.verify-release-source.outputs.tag-object }}
        run: |
          set -euo pipefail
          default_refs="$(git ls-remote --symref origin HEAD refs/heads/main)"
          [[ "$(printf '%s\n' "$default_refs" | \
            grep -c $'^ref: refs/heads/main\tHEAD$')" -eq 1 ]]
          tag_ref="refs/tags/$ANGERONA_REF_NAME"
          [[ "$(git ls-remote --refs origin "$tag_ref" | \
            awk -v ref="$tag_ref" '$2 == ref { print $1 }')" == \
            "$ANGERONA_TAG_OBJECT" ]]
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor \
            "$ANGERONA_SOURCE_SHA" refs/remotes/origin/main

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: |
            Angerona-${{ github.ref_name }}-win64.msix
            Angerona-${{ github.ref_name }}-win64.msix.sha256
            Angerona-${{ github.ref_name }}-win64.zip
            Angerona-${{ github.ref_name }}-win64.zip.sha256
            Angerona-${{ github.ref_name }}-linux-x86_64.tar.gz
            Angerona-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
            Angerona-${{ github.ref_name }}-macos-arm64.zip
            Angerona-${{ github.ref_name }}-macos-arm64.zip.sha256
            Angerona-SBOM.json
            Angerona-SBOM-linux-x86_64.json
            Angerona-SBOM-macos-arm64.json
            Angerona-dependencies-linux-x86_64.txt
            Angerona-dependencies-macos-arm64.txt
            Verify-Angerona-Release.ps1
          generate_release_notes: true
