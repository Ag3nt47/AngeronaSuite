name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve filesystem-safe artifact label
        id: artifact_name
        shell: pwsh
        env:
          ANGERONA_RELEASE_EVENT: ${{ github.event_name }}
          ANGERONA_RELEASE_REF: ${{ github.ref_name }}
        run: |
          $artifactTag = python tools/release_artifact_tag.py
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($artifactTag)) {
            throw 'Could not derive a safe release artifact label.'
          }
          "tag=$artifactTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install audited dependencies
        shell: pwsh
        run: |
          # Every third-party wheel is both version-pinned and SHA-256-gated.
          # --no-deps is safe because the reviewed lock enumerates the complete
          # transitive Windows/Python 3.12 environment.
          python -m pip install --require-hashes --no-deps `
            -r requirements-bootstrap-pip.txt
          python -m pip install --require-hashes --no-deps `
            -r requirements-release-hashed.txt
          python -m pip install --no-build-isolation --no-deps .
          # Vosk's wheel is audited, but its upstream srt dependency is source-only.
          # Angerona ships the two-function compatibility surface Vosk actually uses.
          python tools/build_srt_compat_wheel.py --out build/vendor-wheels
          python -m pip install --only-binary :all: build/vendor-wheels/srt-0.0.0+angerona.1-py3-none-any.whl

      - name: Run release gates
        shell: pwsh
        run: |
          python -m compileall -q src tests
          python -m pytest -q

      - name: Bundle verified offline conversation model
        shell: pwsh
        run: |
          $bundleData = Join-Path (Resolve-Path ".") "build/bundled-runtime"
          New-Item -ItemType Directory -Force -Path $bundleData | Out-Null
          $env:ANGERONA_DATA = $bundleData
          python -c "from angerona.connectors.voice import install_offline_model; print(install_offline_model())"

      - name: Build one-file executables with embedded sidecar integrity
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name AngeronaBlackBox `
            --icon "assets/icons/blackbox.ico" `
            --distpath "dist/Angerona" `
            --workpath "build/AngeronaBlackBox" `
            --specpath "build" `
            --collect-all PySide6 `
            --collect-all psutil `
            --add-data "assets;assets" `
            blackbox_recorder.py

          $blackBox = Resolve-Path "dist/Angerona/AngeronaBlackBox.exe"
          $blackBoxHash = (Get-FileHash -Algorithm SHA256 $blackBox).Hash.ToLowerInvariant()
          @(
            '"""Generated by the release workflow; do not edit in an artifact."""'
            ''
            "BLACKBOX_SHA256 = `"$blackBoxHash`""
          ) | Set-Content -Encoding utf8 "src/angerona/_release_integrity.py"

          pyinstaller --noconfirm --clean --windowed --onefile `
            --name Angerona `
            --icon "assets/icons/angerona.ico" `
            --distpath "dist/Angerona" `
            --workpath "build/AngeronaMain" `
            --specpath "build" `
            --paths src `
            --collect-all PySide6 `
            --collect-all yara_x `
            --collect-all vosk `
            --collect-all sounddevice `
            --collect-submodules angerona.modules `
            --collect-submodules angerona.resilience `
            --add-data "modules;modules" `
            --add-data "assets;assets" `
            --add-data "rules.yar;." `
            --add-data "build/bundled-runtime/models;runtime-data/models" `
            --hidden-import angerona `
            src/angerona/__main__.py

      - name: Verify frozen application contents
        shell: pwsh
        run: |
          $listing = (& pyi-archive_viewer --recursive "dist/Angerona/Angerona.exe" | Out-String)
          if ($listing -notmatch 'angerona\.modules\.purple_guard') {
            throw 'Frozen archive is missing dynamically discovered Angerona modules.'
          }
          if ($listing -notmatch 'angerona\._release_integrity') {
            throw 'Frozen archive is missing its embedded Black Box digest.'
          }
          if (-not (Test-Path "dist/Angerona/AngeronaBlackBox.exe")) {
            throw 'Frozen Black Box sidecar was not created.'
          }

      - name: Bundle release installer and documentation
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, Install-Angerona-Release.bat, Install-Angerona-Release.ps1 -Destination dist/Angerona/
          if (Test-Path SECURITY.md) { Copy-Item SECURITY.md -Destination dist/Angerona/ }
          if (Test-Path docs) { Copy-Item docs -Destination dist/Angerona/docs -Recurse }
          if (Test-Path playbooks) { Copy-Item playbooks -Destination dist/Angerona/playbooks -Recurse }

          $releaseFiles = @('Angerona.exe', 'AngeronaBlackBox.exe')
          $manifest = foreach ($name in $releaseFiles) {
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path 'dist/Angerona' $name)).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $manifest | Set-Content -Encoding ascii "dist/Angerona/release-files.sha256"

      - name: Build single-file Windows Setup
        shell: pwsh
        env:
          ANGERONA_ARTIFACT_TAG: ${{ steps.artifact_name.outputs.tag }}
        run: |
          # Do not trust whichever compiler happens to be on the mutable runner
          # image. Fetch the exact upstream release and bind it to the SHA-256
          # published in jrsoftware's signed .issig metadata.
          $innoVersion = '6.7.1'
          $innoSha256 = '4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0'
          $innoInstaller = Join-Path $env:RUNNER_TEMP "innosetup-$innoVersion.exe"
          $innoDir = Join-Path $env:RUNNER_TEMP "InnoSetup-$innoVersion"
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe' `
            -OutFile $innoInstaller
          $actualInnoHash = (Get-FileHash -Algorithm SHA256 $innoInstaller).Hash.ToLowerInvariant()
          if ($actualInnoHash -ne $innoSha256) {
            throw "Inno Setup compiler hash mismatch: $actualInnoHash"
          }
          $install = Start-Process -FilePath $innoInstaller -WindowStyle Hidden `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', `
              '/SP-', '/CURRENTUSER', "/DIR=$innoDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Verified Inno Setup install failed with exit $($install.ExitCode)"
          }

          $artifactTag = $env:ANGERONA_ARTIFACT_TAG
          $appVersion = $artifactTag -replace '^v', ''
          if ($appVersion -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            $appVersion = '0.0.0'
          }
          $compiler = Join-Path $innoDir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Verified Inno Setup compiler was not installed: $compiler"
          }
          & $compiler "/DAppVersion=$appVersion" "/DArtifactTag=$artifactTag" `
            "installer/Angerona.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit $LASTEXITCODE" }
          $setup = "Angerona-$artifactTag-win64-setup.exe"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw "Expected setup artifact was not created: $setup"
          }

      - name: Create SBOM, package, and checksum
        shell: pwsh
        env:
          ANGERONA_ARTIFACT_TAG: ${{ steps.artifact_name.outputs.tag }}
        run: |
          cyclonedx-py environment --output-format JSON --output-file Angerona-SBOM.json
          $zip = "Angerona-$env:ANGERONA_ARTIFACT_TAG-win64.zip"
          $setup = "Angerona-$env:ANGERONA_ARTIFACT_TAG-win64-setup.exe"
          Compress-Archive -Path dist/Angerona/* -DestinationPath $zip
          (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower() + "  " + $zip |
            Set-Content -Encoding ascii "$zip.sha256"
          (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLower() + "  " + $setup |
            Set-Content -Encoding ascii "$setup.sha256"

      - name: Upload gated release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: angerona-release-assets
          if-no-files-found: error
          path: |
            Angerona-${{ steps.artifact_name.outputs.tag }}-win64-setup.exe
            Angerona-${{ steps.artifact_name.outputs.tag }}-win64-setup.exe.sha256
            Angerona-${{ steps.artifact_name.outputs.tag }}-win64.zip
            Angerona-${{ steps.artifact_name.outputs.tag }}-win64.zip.sha256
            Angerona-SBOM.json

  build-posix:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            artifact: linux-x86_64
          - os: macos-15
            platform: macos
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve filesystem-safe artifact label
        id: artifact_name
        shell: bash
        env:
          ANGERONA_RELEASE_EVENT: ${{ github.event_name }}
          ANGERONA_RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          artifact_tag="$(python tools/release_artifact_tag.py)"
          test -n "$artifact_tag"
          printf 'tag=%s\n' "$artifact_tag" >> "$GITHUB_OUTPUT"

      - name: Download and verify locked platform wheels
        shell: bash
        run: |
          set -euo pipefail
          lock="release/locks/posix/${{ matrix.artifact }}.txt"
          manifest="release/locks/posix/${{ matrix.artifact }}.manifest.json"
          wheelhouse="$RUNNER_TEMP/angerona-wheelhouse-${{ matrix.artifact }}"
          mkdir -m 700 "$wheelhouse"
          PIP_DISABLE_PIP_VERSION_CHECK=1 python -m pip download \
            --dest "$wheelhouse" --only-binary=:all: \
            --require-hashes --no-deps -r "$lock"
          python tools/verify_wheelhouse.py \
            --target "${{ matrix.artifact }}" --wheelhouse "$wheelhouse" \
            --lock "$lock" --manifest "$manifest"

      - name: Install verified platform dependencies offline
        shell: bash
        run: |
          set -euo pipefail
          lock="release/locks/posix/${{ matrix.artifact }}.txt"
          wheelhouse="$RUNNER_TEMP/angerona-wheelhouse-${{ matrix.artifact }}"
          PIP_DISABLE_PIP_VERSION_CHECK=1 python -m pip install \
            --no-index --find-links "$wheelhouse" \
            --require-hashes --no-deps -r "$lock"
          PIP_DISABLE_PIP_VERSION_CHECK=1 python -m pip install \
            --no-index --find-links "$wheelhouse" \
            --no-build-isolation --no-deps .
          python -m pip check

      - name: Run platform release gates
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests tools
          python -m pytest -q
          python -m pip_audit
          python - <<'PY'
          from angerona.core.config import Config
          from angerona.core.eventbus import EventBus
          from angerona.core.module_manager import ModuleManager

          manager = ModuleManager(EventBus(), Config.load())
          manager.discover()
          if manager.discovery_errors:
              raise SystemExit(manager.discovery_errors)
          print(f"platform discovery: {len(manager.modules)} capabilities")
          PY

      - name: Build native application
        shell: bash
        run: |
          set -euo pipefail
          pyinstaller --noconfirm --clean --windowed --onefile \
            --name Angerona \
            --distpath dist \
            --workpath build/Angerona \
            --specpath build \
            --paths src \
            --collect-all PySide6 \
            --collect-all yara_x \
            --collect-all psutil \
            --collect-submodules angerona.modules \
            --collect-submodules angerona.resilience \
            --add-data "modules:modules" \
            --add-data "assets:assets" \
            --add-data "rules.yar:." \
            --hidden-import angerona \
            src/angerona/__main__.py

      - name: Verify and package native application
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ steps.artifact_name.outputs.tag }}
        run: |
          set -euo pipefail
          listing=$(pyi-archive_viewer --recursive \
            "$([ "$PLATFORM" = macos ] && printf 'dist/Angerona.app/Contents/MacOS/Angerona' || printf 'dist/Angerona')")
          printf '%s' "$listing" | grep -q 'angerona.modules.linux_observe\|angerona.modules.macos_observe'
          printf '%s' "$listing" | grep -q 'angerona.core.sensor_events'

          package="package-$ARTIFACT"
          mkdir -p "$package"
          cp README.md LICENSE Install-Angerona-Release.sh uninstall-angerona.sh "$package/"
          if [ "$PLATFORM" = macos ]; then
            cp -R dist/Angerona.app "$package/"
            archive="Angerona-$TAG-$ARTIFACT.zip"
            ditto -c -k --sequesterRsrc --keepParent "$package" "$archive"
          else
            install -m 0755 dist/Angerona "$package/Angerona"
            archive="Angerona-$TAG-$ARTIFACT.tar.gz"
            tar -czf "$archive" "$package"
          fi
          shasum -a 256 "$archive" > "$archive.sha256"
          cyclonedx-py environment --output-format JSON \
            --output-file "Angerona-SBOM-$ARTIFACT.json"
          python -m pip freeze --all > "Angerona-dependencies-$ARTIFACT.txt"

      - name: Upload platform release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: angerona-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            Angerona-${{ steps.artifact_name.outputs.tag }}-${{ matrix.artifact }}.*
            Angerona-SBOM-${{ matrix.artifact }}.json
            Angerona-dependencies-${{ matrix.artifact }}.txt

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-posix]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download gated assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: angerona-*
          merge-multiple: true

      - name: Attest release archive
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e # v4
        with:
          subject-path: |
            Angerona-${{ github.ref_name }}-win64-setup.exe
            Angerona-${{ github.ref_name }}-win64.zip
            Angerona-${{ github.ref_name }}-linux-x86_64.tar.gz
            Angerona-${{ github.ref_name }}-macos-arm64.zip

      - name: Attest software bill of materials
        uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        with:
          subject-path: |
            Angerona-${{ github.ref_name }}-win64-setup.exe
            Angerona-${{ github.ref_name }}-win64.zip
          sbom-path: Angerona-SBOM.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: |
            Angerona-${{ github.ref_name }}-*
            Angerona-SBOM*.json
            Angerona-dependencies-*.txt
          generate_release_notes: true
