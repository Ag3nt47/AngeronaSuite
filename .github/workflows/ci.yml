name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -e . "pytest==9.1.1" "hypothesis==6.163.0"
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Test
        run: python -m pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit resolved runtime dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -e . "pip-audit==2.10.1"
          python -m pip_audit

  platform-smoke:
    name: ${{ matrix.platform }} platform contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            extra: windows
          - os: ubuntu-24.04
            platform: linux
            extra: linux
          - os: macos-15
            platform: macos-arm64
            extra: macos
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install platform dependencies
        run: python -m pip install -e ".[${{ matrix.extra }}]" "pytest==9.1.1"
      - name: Compile platform adapters
        run: python -m compileall -q src tests tools
      - name: Exercise platform contracts and packaging policy
        run: >-
          python -m pytest -q
          tests/test_linux_platform_contract.py
          tests/test_macos_platform_contract.py
          tests/test_release_setup.py
