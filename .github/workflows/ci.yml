name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-readme:
    name: Public README integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check recovery bundle and launcher pins offline
        run: python tools/build_startup_recovery_manifest.py --check
      - name: Validate tracked README assets offline
        run: python tools/validate_documentation_drift.py
      - name: Verify exact images served from public main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANGERONA_PUBLIC_REPOSITORY: ${{ github.repository }}
        run: >-
          python tools/verify_published_readme_assets.py
          --repository "$ANGERONA_PUBLIC_REPOSITORY"
          --ref main
          --attempts 5

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    # Hosted Python 3.10 and 3.11 have reached the final test files at the 60-minute cap.
    # Full native/Qt suite reached 90% without failures before the 60m wall limit.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: frz/watchdog3/go.sum
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade --require-hashes --no-deps -r requirements-bootstrap-pip.txt
          # Exercise actual YARA-X response and disposable Windows Job Object integration tests.
          python -m pip install -e ".[ugcap]" "pytest==9.1.1" "hypothesis==6.163.0" "pywin32==312" "yara-x==1.19.0"
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Establish protected source data custody
        shell: powershell
        run: |
          $dataRoot = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) "AngeronaData"
          & "$env:GITHUB_WORKSPACE\tools\protect-key-custody.ps1" -DataRoot $dataRoot
      - name: Check native recovery startup contracts
        shell: pwsh
        env:
          ANGERONA_PYTEST_CONSOLE_DIAGNOSTICS: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $recoveryTests = @(
            'tests/test_startup_bootstrap.py::test_pinned_verifier_self_restore_holds_all_mutation_locks_and_preserves_private_edits'
            'tests/test_startup_process_admission.py::test_owned_recovery_window_retires_its_exact_reader_tree_before_retry'
            'tests/test_startup_critical_lease.py::test_critical_native_short_output_is_visible_before_actual_producer_exit'
            'tests/test_source_startup_strategies.py::test_native_gui_owner_requests_visible_startup_while_commands_stay_hidden'
            'tests/test_source_startup_strategies.py::test_supervisor_waits_for_exact_native_first_paint_and_ready_retires_shell'
            'tests/test_source_activation_file_custody.py::test_explicit_native_owner_rights_directory_passes_exact_read_only_query'
            'tests/test_source_activation_file_custody.py::test_actual_publication_and_reverse_rename_keep_both_file_objects'
            'tests/test_shadow_shield_storage.py::test_primary_policy_and_limited_observation_advance_between_cleanup_passes'
          )
          python -u -X faulthandler -m tools.ci_pytest -v @recoveryTests
          exit $LASTEXITCODE
      - name: Test
        shell: pwsh
        env:
          ANGERONA_PYTEST_CONSOLE_DIAGNOSTICS: "1"
          ANGERONA_PYTEST_TRACE_PATH: ${{ runner.temp }}/angerona-pytest-trace.jsonl
          ANGERONA_PYTEST_EXIT_PATH: ${{ runner.temp }}/angerona-pytest-exit.jsonl
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python -u -X faulthandler -m tools.ci_pytest -v -p tools.pytest_execution_trace --durations=25 --durations-min=1.0
          $pytestExit = $LASTEXITCODE
          Write-Host "Pytest native process exit code: $pytestExit"
          try {
            foreach ($diagnosticPath in @($env:ANGERONA_PYTEST_TRACE_PATH, $env:ANGERONA_PYTEST_EXIT_PATH)) {
              if (Test-Path -LiteralPath $diagnosticPath) {
                Write-Host "Pytest diagnostic tail: $(Split-Path -Leaf $diagnosticPath)"
                foreach ($line in (Get-Content -LiteralPath $diagnosticPath -Tail 8)) {
                  $row = ConvertFrom-Json -InputObject $line -AsHashtable
                  $safe = [ordered]@{}
                  foreach ($field in @('kind', 'monotonic', 'when', 'outcome', 'duration', 'exitstatus', 'testsfailed', 'testscollected', 'completed', 'exit_code', 'exit_code_type', 'exception_type', 'python', 'argument_count')) {
                    if ($row.ContainsKey($field)) { $safe[$field] = $row[$field] }
                  }
                  if ($row.ContainsKey('nodeid')) { $safe['nodeid'] = ($row['nodeid'] -split '\[', 2)[0] }
                  $safe | ConvertTo-Json -Compress
                }
              }
            }
          } catch {
            Write-Host "Pytest diagnostic tail unavailable."
          }
          exit $pytestExit

  native-watchdog:
    name: Native watchdog console and STOP contracts
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: |
            frz/go.sum
            frz/watchdog3/go.sum
      - name: Exercise the optional Go watchdog with inert helper processes
        working-directory: frz
        shell: pwsh
        run: |
          go test -mod=readonly -timeout 90s angerona_watchdog.go angerona_watchdog_test.go
          exit $LASTEXITCODE
      - name: Test independent third watchdog and Windows custody contracts
        working-directory: frz/watchdog3
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          go test -mod=readonly -timeout 180s ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -mod=readonly ./...
          exit $LASTEXITCODE
      - name: Build standalone Go watchdog artifact
        shell: pwsh
        run: |
          & ./tools/Build-AngeronaWatchdog3.ps1 -SkipTests
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: watchdog3-windows-amd64-unsigned
          path: |
            build/watchdog3/watchdog3.exe
            build/watchdog3/watchdog3.exe.build.json
            build/watchdog3/watchdog3.exe.NOTICE.txt
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit resolved runtime dependencies
        run: |
          python -m pip install --upgrade --require-hashes --no-deps -r requirements-bootstrap-pip.txt
          python -m pip install -e ".[ugcap]" "pip-audit==2.10.1"
          python -m pip_audit

  platform-smoke:
    name: ${{ matrix.platform }} platform contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            extra: windows
          - os: ubuntu-24.04
            platform: linux
            extra: linux
          - os: macos-15
            platform: macos-arm64
            extra: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install platform dependencies
        run: python -m pip install -e ".[${{ matrix.extra }},ugcap]" "pytest==9.1.1"
      - name: Compile platform adapters
        run: python -m compileall -q src tests tools
      - name: Exercise platform contracts and packaging policy
        run: >-
          python -m pytest -q
          tests/test_linux_platform_contract.py
          tests/test_macos_platform_contract.py
          tests/test_release_setup.py
          tests/test_native_installers.py

  native-source-install:
    name: Native installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check native shell syntax
        shell: bash
        run: |
          sh -n install-angerona.sh tools/native-quickstart.sh
          bash -n Start-Angerona-Linux.sh
          if [[ "$RUNNER_OS" == macOS ]]; then
            zsh -n Start-Angerona-macOS.command
          fi
      - name: Install Linux Qt runtime prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: python tools/check_native_gui.py --install-system-libraries --yes
      - name: Install runtime and render an offscreen QApplication
        shell: bash
        run: |
          export PYTHON="$(command -v python)"
          if [[ "$(uname -s)" == Darwin && "$(uname -m)" == x86_64 ]]; then
            brew install openssl@3 rust
            export OPENSSL_DIR="$(brew --prefix openssl@3)"
            sh install-angerona.sh --no-autostart --build-intel-crypto
          else
            sh install-angerona.sh --no-autostart
          fi
      - name: Verify installed entry points
        shell: bash
        run: |
          test -x "$HOME/.local/bin/angerona"
          test -x "$HOME/.local/bin/angerona-setup"
          sh -n "$HOME/.local/bin/angerona" "$HOME/.local/bin/angerona-setup"
