name: Bug report
description: Report a reproducible Angerona defect without sharing private telemetry.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for helping improve Angerona. Remove credentials, identities,
        paths, addresses, command lines, and private host telemetry before posting.
  - type: input
    id: version
    attributes:
      label: Angerona version or commit
      placeholder: v1.10.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows Protect
        - macOS Observe
        - Linux Observe + Detect
        - Other / packaging only
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected area
      options:
        - Classic dashboard
        - Flow dashboard / Local SOC
        - Installer or updater
        - Sensor or module
        - Red Team simulation
        - Forensics
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic inputs where possible.
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostics
      description: Paste only minimal, manually redacted logs or synthetic screenshots.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed secrets, identities, paths, addresses, command lines, and private telemetry.
          required: true

